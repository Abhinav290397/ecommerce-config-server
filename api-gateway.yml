#For webflux
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - StripPrefix=2
            #                - RedirectTo=302, http://codingshuttle.com
                - name: LoggingOrdersFilter
                - name: AuthenticationFilter
                  args:
                    isEnabled: true

                - name: Authorization
                  args:
                    allowedRoles: ADMIN, USER, SUPERADMIN

            - id: inventory-service
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/api/v1/inventory/**
              filters:
                - StripPrefix=2
                - AddRequestHeader=X-Custom-Header, Abhinav
                - name: AuthenticationFilter

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
