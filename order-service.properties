server.servlet.context-path=/orders
server.port=9020

#DB configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/ordersdb
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#spring.jpa.defer-datasource-initialization=true
#spring.sql.init.mode=always
#spring.sql.init.data-locations=classpath:data.sql

# Force PostgreSQL-compatible timezone
spring.datasource.hikari.data-source-properties.options=-c TimeZone=Asia/Kolkata

eureka.instance.prefer-ip-address=true

my.variable=order-github-default
